name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Toolchain
        run: go version

      # 与 scripts/verify.sh 同源：fmt / vet / test / race / arm64 / fuzz
      - name: Verify
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: sh ./scripts/verify.sh

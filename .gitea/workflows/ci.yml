name: CI

# 2026-11-15 止血：内网 Gitea Actions 的 runner 注册数长期为 0，
# 且 GitHub 出站不通（checkout/setup-go 拉不到），自动触发只会持续堆积
# queued run（实测 113 run / 0 success / 7 queued）。在注册 runner 并解决
# 出站之前，收窄为「仅手动触发」：保留 workflow 作为将来恢复自动 CI 的
# 同源配置，但不再让每次 push/PR 产生僵尸 run。
# 要恢复自动触发：确认 actions/runners total_count > 0 且 GitHub action 可拉取后，
# 在两份（.gitea / .github）workflow 里同时加回 push / pull_request 段；
# check_docs.sh 的「双 CI workflow 逐字一致」门禁会校验两边同步。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Toolchain
        run: go version

      # 与 scripts/verify.sh 同源：fmt / vet / test / race / arm64 / wasm / bench / fuzz
      # 不覆盖 GOPROXY：由 verify.sh 按环境兜底（内网走 goproxy.cn）。
      - name: Verify
        run: sh ./scripts/verify.sh

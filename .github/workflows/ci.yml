name: CI

# 发布到 GitHub 后恢复自动触发：GitHub Actions 自带 runner，push/PR 均会跑
# 与 scripts/verify.sh 同源的全套门禁。保留 workflow_dispatch 便于手动重跑。
# 注：内网 Gitea 若 runner 数仍为 0，其侧自动 run 会 queued；可在 Gitea 侧
# 单独禁用自动触发，但两份文件须保持逐字一致（check_docs.sh 门禁校验）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Toolchain
        run: go version

      # 与 scripts/verify.sh 同源：fmt / vet / test / race / arm64 / wasm / bench / fuzz
      # 不覆盖 GOPROXY：由 verify.sh 按环境兜底（必要时设 goproxy.cn）。
      - name: Verify
        run: sh ./scripts/verify.sh

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Toolchain
        run: go version

      # 与 scripts/verify.sh 同源：fmt / vet / test / race / arm64 / wasm / bench / fuzz
      # 不覆盖 GOPROXY：由 verify.sh 按环境兜底（内网走 goproxy.cn）。
      - name: Verify
        run: sh ./scripts/verify.sh
